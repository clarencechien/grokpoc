<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>草船借箭 · 立體繪本</title>
<style>
  :root{
    --room-1:#10141f; --room-2:#1d2740;
    --ink:#f2e8d5; --dim:#9aa6bd; --gold:#e8b765;
    --cap-h:clamp(116px,22vh,188px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 90% at 50% 0%,var(--room-2),var(--room-1) 72%);
    color:var(--ink); font-family:"Noto Serif TC","Songti TC",ui-serif,Georgia,serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  header{padding:clamp(10px,2.2vh,20px) 16px 0; text-align:center; flex:none}
  h1{margin:0; font-size:clamp(17px,3vw,26px); letter-spacing:.3em; text-indent:.3em}
  .sub{margin:4px 0 0; font-size:11px; letter-spacing:.18em; color:var(--dim)}

  /* ---------- stage ---------- */
  /* The stage owns the leftover height; the media letterboxes inside it with
     object-fit, so the book can never grow past its box and cover the caption. */
  #stage{position:relative; flex:1 1 auto; min-height:0; padding:0 clamp(12px,3vw,28px)}
  .frame{position:absolute; inset:0 clamp(12px,3vw,28px); margin:auto;
         max-width:1180px; left:0; right:0}
  .frame video,.frame img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity .45s ease; border-radius:4px;
  }
  .frame video.on,.frame img.on{opacity:1}

  /* chapter card, shown over the blank book mid-turn */
  #card{
    position:absolute; inset:0; display:grid; place-items:center; text-align:center;
    opacity:0; transition:opacity .5s ease; pointer-events:none;
  }
  #card.on{opacity:1}
  #card .no{font-size:clamp(11px,2vw,13px); letter-spacing:.42em; color:var(--gold); text-indent:.42em}
  #card .ti{margin-top:.5em; font-size:clamp(20px,4.4vw,38px); letter-spacing:.2em; text-indent:.2em;
            color:#2f2416; text-shadow:0 1px 0 #ffffff55}
  #card .no{color:#7a5c2e}

  /* ---------- caption ---------- */
  #cap{
    flex:none; height:var(--cap-h); padding:10px clamp(16px,5vw,40px) 6px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    opacity:1; transition:opacity .4s ease;
  }
  #cap.hide{opacity:0}
  #cap h2{margin:0 0 6px; font-size:clamp(13px,2.4vw,17px); letter-spacing:.14em; color:var(--gold)}
  #cap p{margin:0; max-width:52em; font-size:clamp(12.5px,2.1vw,16px); line-height:1.95;
         white-space:pre-line; color:#e2dbcd}

  /* ---------- controls ---------- */
  nav{flex:none; display:flex; gap:8px; align-items:center; justify-content:center;
      padding:0 16px clamp(10px,2vh,18px); flex-wrap:wrap}
  button{
    font:inherit; font-size:13px; color:var(--ink); cursor:pointer;
    background:#ffffff10; border:1px solid #ffffff20; border-radius:999px; padding:7px 15px;
    transition:background .18s,border-color .18s,opacity .18s;
  }
  button:hover:not(:disabled){background:#ffffff1e; border-color:#ffffff3a}
  button:disabled{opacity:.3; cursor:default}
  .dots{display:flex; gap:6px; margin:0 4px}
  .dot{width:7px;height:7px;border-radius:50%;background:#ffffff28;border:0;padding:0;cursor:pointer}
  .dot[aria-current="true"]{background:var(--gold)}
  .note{flex:none; text-align:center; font-size:11px; color:var(--dim); opacity:.7;
        padding:0 16px clamp(8px,1.6vh,14px)}
  @media (max-width:620px){ :root{--cap-h:clamp(132px,26vh,210px)} h1{letter-spacing:.2em} }
</style>
</head>
<body>
<header>
  <h1 id="title">草船借箭</h1>
  <p class="sub" id="subtitle"></p>
</header>

<div id="stage">
  <div class="frame" id="frame">
    <img id="poster" alt="">
    <video id="va" muted playsinline preload="auto"></video>
    <video id="vb" muted playsinline preload="auto"></video>
    <div id="card"><div><div class="no" id="cardNo"></div><div class="ti" id="cardTi"></div></div></div>
  </div>
</div>

<div id="cap"><h2 id="capTitle"></h2><p id="capText"></p></div>

<nav>
  <button id="prev">← 上一頁</button>
  <span class="dots" id="dots"></span>
  <button id="next">翻下一頁 →</button>
</nav>
<p class="note" id="note"></p>

<script>
const DATA = {"title": "草船借箭", "subtitle": "紙雕動態繪本 · Grok Image-to-Video", "pages": [{"id": "cover", "no": "", "title": "草船借箭", "text": "赤壁之前，江上大霧。\n三日之內，十萬支箭——這是一樁不可能的軍令，也是一個早已想好的計策。", "still": "cover.jpg?v=184b21e799", "ambient": "cover_ambient.mp4?v=c4cb0dc969", "turn": "cover_turn.mp4?v=3d309290f1", "rise": null}, {"id": "c1", "no": "1", "title": "周瑜的刁難", "text": "赤壁大戰前，周瑜妒忌諸葛亮的才智，故意設下難題：「軍中缺箭，就請先生在十天內趕造十萬支箭吧。」\n這分明是要陷害他。諸葛亮卻只是搖著羽扇，微微一笑。", "still": "c1.jpg?v=b01072c267", "ambient": "c1_ambient.mp4?v=51f9877800", "turn": "c1_turn.mp4?v=e086257884", "rise": "c1_rise.mp4?v=dfb41da3fd"}, {"id": "c2", "no": "2", "title": "三日的軍令狀", "text": "「十天太久，只要三天就夠了。」諸葛亮竟當眾立下軍令狀：若造不出箭，甘願受罰。\n周瑜暗自得意，以為這回諸葛亮插翅難逃。", "still": "c2.jpg?v=4fcedb17af", "ambient": "c2_ambient.mp4?v=4f182d653e", "turn": "c2_turn.mp4?v=f4c1f306ed", "rise": "c2_rise.mp4?v=6bd75d2b88"}, {"id": "c3", "no": "3", "title": "向魯肅借船", "text": "諸葛亮悄悄找來魯肅，借了二十艘快船，每船三十名軍士，船身兩側綁滿稻草人，再用青布幔子遮起來。\n「千萬別告訴都督。」諸葛亮低聲叮嚀。", "still": "c3.jpg?v=8fbf92fbcc", "ambient": "c3_ambient.mp4?v=cc73f9a2f9", "turn": "c3_turn.mp4?v=10da807607", "rise": "c3_rise.mp4?v=d0ff811b4f"}, {"id": "c4", "no": "4", "title": "按兵不動", "text": "第一天，諸葛亮沒有動靜。第二天，還是沒有動靜。\n魯肅急得團團轉，諸葛亮卻只是喝茶讀書，彷彿胸有成竹。", "still": "c4.jpg?v=3841d57d76", "ambient": "c4_ambient.mp4?v=cae82e65fb", "turn": "c4_turn.mp4?v=d913714e0b", "rise": "c4_rise.mp4?v=794e9757bf"}, {"id": "c5", "no": "5", "title": "大霧漫江", "text": "到了第三天四更，江上忽然起了漫天大霧，對面看不見人影。\n諸葛亮請魯肅一同上船，二十艘船用長索連成一線，趁著濃霧向北岸曹營划去。", "still": "c5.jpg?v=810611986f", "ambient": "c5_ambient.mp4?v=3ba5a2abed", "turn": "c5_turn.mp4?v=2efd16c800", "rise": "c5_rise.mp4?v=76676dee5e"}, {"id": "c6", "no": "6", "title": "擂鼓吶喊", "text": "船隊逼近曹營水寨，諸葛亮下令一字排開，軍士一齊擂鼓吶喊，聲勢震天。\n魯肅嚇得臉色發白：「萬一曹兵殺出來怎麼辦？」諸葛亮大笑：「霧這麼大，曹操必不敢出。」", "still": "c6.jpg?v=8a019c0bbc", "ambient": "c6_ambient.mp4?v=cbd7d94c84", "turn": "c6_turn.mp4?v=d32b6d1ab5", "rise": "c6_rise.mp4?v=bf71c77713"}, {"id": "c7", "no": "7", "title": "萬箭齊發", "text": "曹操聽見鼓聲，怕有埋伏，不敢出戰，只命一萬多名弓箭手朝江面猛射。\n箭如飛蝗，密密麻麻地插滿了草人和船身。諸葛亮又下令調頭，讓另一side也受滿了箭。", "still": "c7.jpg?v=6c4a6b7180", "ambient": "c7_ambient.mp4?v=ccf7190633", "turn": "c7_turn.mp4?v=ad1de7b04e", "rise": "c7_rise.mp4?v=4b26c1cd3d"}, {"id": "c8", "no": "8", "title": "滿載而歸", "text": "天快亮時，霧漸漸散去，二十艘船上插滿了箭，足足超過十萬支。\n軍士齊聲高喊：「謝丞相賜箭！」船隊順流而回。諸葛亮如期交箭，周瑜聽了，長長地嘆了一口氣：「我真的比不上他啊。」", "still": "c8.jpg?v=778c64cc18", "ambient": "c8_ambient.mp4?v=0f23aca88d", "turn": "c8_turn.mp4?v=c6eda7fe45", "rise": "c8_rise.mp4?v=9c98cc5f97"}]};
const A = "assets/";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TURN_RATE = 3.5;   // transition clips play fast; ambient stays at 1x
const CARD_MS   = 500;   // how long the chapter title sits on the blank book

const frame = document.getElementById("frame");
const poster = document.getElementById("poster");
const vids = [document.getElementById("va"), document.getElementById("vb")];
const card = document.getElementById("card");
const capEl = document.getElementById("cap");
const dotsEl = document.getElementById("dots");
const btnPrev = document.getElementById("prev");
const btnNext = document.getElementById("next");

let idx = 0;        // current page index
let busy = false;   // a transition is playing
let slot = 0;       // which <video> is live
let live = null;    // transition clip currently on screen, if any
let skipCard = false;

/* A second click while a page is turning means "get on with it". */
function skip(){
  skipCard = true;
  if (live){
    try { live.pause(); if (isFinite(live.duration)) live.currentTime = live.duration; } catch {}
    if (live.onended) live.onended();          // resolve now; do not wait for the seek
  }
}

const page = i => DATA.pages[i];
const url = f => f ? A + f : null;

function showOnly(el){
  [poster, ...vids].forEach(n => n.classList.toggle("on", n === el));
}

/* Play one clip in the idle video element; resolve when it ends.
   A clip that will not load must never leave a stale frame on screen or hang
   the book, so every failure path falls back to the page's still. */
function playClip(file, {loop = false, fallback = null, rate = 1} = {}){
  return new Promise(resolve => {
    const v = vids[slot ^ 1];
    let done = false;
    const finish = ok => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (!ok && fallback) showStill(fallback);
      resolve(ok ? v : null);
    };
    v.loop = loop;
    v.onended = null;
    v.oncanplay = null;
    live = loop ? null : v;          // a transition clip the reader may skip
    v.onerror = () => finish(false);
    const timer = setTimeout(() => finish(false), 6000);   // stalled load
    const start = () => {
      clearTimeout(timer);
      showOnly(v);
      slot ^= 1;
      v.playbackRate = rate;
      v.play().catch(() => {});
      if (loop) finish(true); else v.onended = () => finish(true);
    };
    v.src = url(file);
    if (v.readyState >= 2) start(); else v.oncanplay = () => { v.oncanplay = null; start(); };
  });
}

function showStill(file){
  poster.src = url(file);
  showOnly(poster);
}

function paintCaption(i){
  const p = page(i);
  document.getElementById("capTitle").textContent = p.no ? `${p.no}. ${p.title}` : p.title;
  document.getElementById("capText").textContent = p.text || "";
  [...dotsEl.children].forEach((d, k) => d.setAttribute("aria-current", String(k === i)));
  btnPrev.disabled = i === 0;
  btnNext.disabled = i === DATA.pages.length - 1;
}

/* Settle on a page: loop its ambient clip, or hold its still. */
async function settle(i){
  idx = i;
  paintCaption(i);
  capEl.classList.remove("hide");
  const p = page(i);
  if (p.ambient && !reduce) await playClip(p.ambient, {loop: true, fallback: p.still});
  else showStill(p.still);
}

/* Turn from page i to page j (j = i+1 or i-1). */
async function turn(j){
  if (busy){ skip(); return; }
  if (j < 0 || j >= DATA.pages.length) return;
  busy = true; skipCard = false; live = null;
  const from = page(idx), to = page(j);
  capEl.classList.add("hide");

  if (reduce){ await settle(j); busy = false; return; }

  // 1. the page flips up and the book goes blank
  if (from.turn) await playClip(from.turn, {fallback: from.still, rate: TURN_RATE});

  // 2. over the blank book, name the chapter
  document.getElementById("cardNo").textContent = to.no ? `第 ${to.no} 章` : "序";
  document.getElementById("cardTi").textContent = to.title;
  card.classList.add("on");
  await new Promise(r => {
    const t = setTimeout(r, CARD_MS);
    const poll = setInterval(() => { if (skipCard){ clearTimeout(t); clearInterval(poll); r(); } }, 60);
    setTimeout(() => clearInterval(poll), CARD_MS + 50);
  });
  card.classList.remove("on");

  // 3. the new diorama rises out of the blank page
  if (to.rise) await playClip(to.rise, {fallback: to.still, rate: TURN_RATE});
  await settle(j);
  live = null;
  busy = false;
}

/* ---------- boot ---------- */
document.getElementById("title").textContent = DATA.title;
document.getElementById("subtitle").textContent = DATA.subtitle || "";
DATA.pages.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "dot"; b.type = "button";
  b.setAttribute("aria-label", p.title);
  b.addEventListener("click", () => { if (i !== idx) turn(i > idx ? idx + 1 : idx - 1); });
  dotsEl.appendChild(b);
});

btnNext.addEventListener("click", () => turn(idx + 1));
btnPrev.addEventListener("click", () => turn(idx - 1));
frame.addEventListener("click", () => turn(idx + 1));
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); turn(idx + 1); }
  if (e.key === "ArrowLeft") turn(idx - 1);
});
let wheelLock = 0;
addEventListener("wheel", e => {
  const now = Date.now();
  if (Math.abs(e.deltaY) < 24) return;
  if (busy){ skip(); return; }
  if (now - wheelLock < 420) return;
  wheelLock = now;
  turn(e.deltaY > 0 ? idx + 1 : idx - 1);
}, {passive: true});

const n = DATA.pages.length;
const clips = DATA.pages.filter(p => p.ambient).length;
document.getElementById("note").textContent = reduce
  ? `${n} 頁 · 已依系統設定停用動態轉場`
  : `${n} 頁 · ${clips} 頁有動態 · 點畫面、按空白鍵或向下捲動即可翻頁`;
settle(0);
</script>
</body>
</html>
