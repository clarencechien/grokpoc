<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三隻小豬 · 立體繪本</title>
<style>
  :root{
    --paper:#f6ead2; --ink:#3a2c21; --edge:#d8c3a0;
    --desk-1:#4a3524; --desk-2:#2a1d13; --desk-3:#15100b;
    --accent:#c4562f; --accent-2:#6b8f5e; --gold:#f0c98b;
    --tilt:15deg;          /* how far the book lies back on the desk        */
    --rx:0deg; --ry:0deg;  /* pointer parallax, layered on top of the tilt  */
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0; height:100%}
  body{
    font-family:"Noto Serif TC","Songti TC",ui-serif,Georgia,serif;
    color:var(--paper);
    /* the desk: warm wood, lit from above, deepening to the edges */
    background:
      radial-gradient(130% 100% at 50% -10%, #6a4a30 0%, var(--desk-1) 26%, var(--desk-2) 62%, var(--desk-3) 100%);
    overflow-x:hidden;
  }
  body::before{ /* faint woodgrain streaks + top light pool */
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60% 40% at 50% 8%, #ffe9c419, #0000 70%),
      repeating-linear-gradient(96deg,#0000 0 22px,#00000010 22px 24px);
    mix-blend-mode:soft-light;
  }

  /* ---------- fixed 3D stage: the book stays put, the scroll drives it ---------- */
  .deck{
    position:fixed; inset:0; z-index:1;
    display:grid; place-items:start center;   /* sit the book high so the caption never covers it */
    padding-top:clamp(22px,7vh,64px);
    perspective:1700px; perspective-origin:50% 34%;
    pointer-events:none;               /* let scroll pass through            */
  }
  .parallax{
    transform:rotateX(var(--rx)) rotateY(var(--ry));
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.22,.9,.3,1);
  }
  .book{
    position:relative;
    /* height-capped (86vh drives ~57vh tall) so the book's bottom edge clears
       the caption band; width follows the 3:2 ratio */
    width:min(88vw,86vh,960px); aspect-ratio:3/2;
    transform-style:preserve-3d;
    transform:rotateX(var(--tilt));    /* the book reclines on the desk      */
  }
  .book::after{ /* soft contact shadow cast onto the desk under the book */
    content:""; position:absolute; left:6%; right:6%; bottom:-7%; height:16%;
    background:radial-gradient(60% 100% at 50% 0%, #0009, #0000 72%);
    transform:translateZ(-2px); filter:blur(6px); z-index:0;
  }

  /* a spread = one chapter's open page, hinged along its TOP edge so it
     turns UPWARD (bottom lifts toward you) — a book you flip away from
     yourself on a desk, not a left/right page-turn */
  .spread{
    position:absolute; inset:0; transform-style:preserve-3d;
    transform-origin:50% 0%;
    transform:translateZ(var(--sz,0px)) rotateX(var(--turn,0deg)) scale(var(--sc,1));
    background:linear-gradient(120deg,#efe0c1,var(--paper) 12%,var(--paper) 88%,#e6d4af);
    border-radius:7px;
    box-shadow:0 40px 80px -26px #000c, 0 0 0 1px var(--edge) inset;
    overflow:hidden; will-change:transform,opacity;
  }
  .spread .grain{ /* printed-paper tooth */
    position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(0deg,#0000 0 3px,#00000008 3px 4px);
  }

  /* pop-up layers: a card folded flat into the page (--fold:-90deg) that
     stands straight up (--fold:0) when its chapter scrolls into view */
  .layer{
    position:absolute; left:50%; bottom:9%; width:var(--w);
    transform-style:preserve-3d; transform-origin:50% 100%; will-change:transform;
    transform:translateX(-50%) translate(var(--dx),var(--dy)) translateZ(var(--z)) rotateX(var(--fold,-90deg));
    transition:filter .4s ease;
  }
  .layer img,.layer video{display:block; width:100%; height:auto}
  /* a standing cut-paper card: cream mount, rounded top, own drop shadow */
  .layer.cut{
    background:var(--paper); padding:2.2% 2.2% 0; border-radius:15px 15px 3px 3px;
    box-shadow:0 22px 30px -16px #00000085, 0 0 0 1px #00000014;
  }
  .layer.cut img,.layer.cut video{border-radius:10px 10px 0 0}
  /* the backdrop plate lies flat, filling the whole spread */
  .layer.plate{
    left:0; bottom:0; width:100%; height:100%;
    transform:translateZ(0); transform-origin:50% 0%; border-radius:7px; overflow:hidden;
  }
  .layer.plate img,.layer.plate video{width:100%; height:100%; object-fit:cover}
  .spread .gutter{ /* subtle centre fold so it still reads as a bound book */
    position:absolute; top:0; bottom:0; left:50%; width:38px; transform:translateX(-50%);
    background:linear-gradient(90deg,#0000,#00000022 46%,#0000002e 50%,#00000022 54%,#0000);
    z-index:6; pointer-events:none;
  }

  /* ---------- the cover, hinged at the top like the spreads ---------- */
  .cover{
    position:absolute; inset:0; transform-origin:50% 0%;
    transform:rotateX(var(--turn,0deg));
    border-radius:9px; overflow:hidden; z-index:200; will-change:transform,opacity;
    background:
      linear-gradient(160deg,#8f3f22,#c4562f 40%,#a8492a);
    box-shadow:0 46px 90px -28px #000d, 0 0 0 1px #00000030 inset, 0 0 0 6px #ffffff10 inset;
    display:grid; place-items:center; text-align:center;
  }
  .cover .plate-frame{
    position:absolute; inset:7% 8%; border-radius:6px; overflow:hidden;
    box-shadow:0 0 0 3px #ffffff22, 0 18px 40px -18px #0009;
  }
  .cover .plate-frame img{width:100%; height:100%; object-fit:cover; opacity:.92}
  .cover .veil{position:absolute; inset:0; background:linear-gradient(180deg,#0000 30%,#00000066)}
  .cover .band{position:relative; z-index:2; padding:0 8%}
  .cover h1{
    margin:0; font-size:clamp(30px,6vw,58px); letter-spacing:.24em; text-indent:.24em;
    color:#fff7ea; text-shadow:0 3px 0 #0004, 0 12px 30px #0007;
  }
  .cover .sub{margin:14px 0 0; font-size:clamp(12px,2.2vw,15px); letter-spacing:.34em; color:#ffe9c9cc}

  /* ---------- captions: kaori-style reveals in a fixed overlay ---------- */
  .captions{position:fixed; left:0; right:0; bottom:0; z-index:20; pointer-events:none;
    display:grid; place-items:end center; padding:0 clamp(16px,4vw,40px) clamp(20px,5vh,46px)}
  .cap{
    grid-area:1/1; width:min(680px,92vw); pointer-events:auto;
    background:linear-gradient(180deg,#1a120bd0,#0d0906e0);
    border:1px solid #ffffff1c; border-radius:16px; backdrop-filter:blur(9px);
    padding:clamp(16px,2.6vw,24px) clamp(18px,3vw,30px);
    box-shadow:0 24px 60px -24px #000c; will-change:transform,opacity;
  }
  .cap .k{font-size:12px; letter-spacing:.32em; color:var(--gold); opacity:.85}
  .cap h2{margin:6px 0 10px; font-size:clamp(17px,3vw,23px); letter-spacing:.08em; color:#fbe6c6}
  .cap p{margin:0; font-size:clamp(14px,2.4vw,16.5px); line-height:1.95; white-space:pre-line; color:#efe3ccdd}

  /* ---------- chrome: title, progress rail, hint, footer ---------- */
  .brand{position:fixed; top:clamp(14px,3vh,26px); left:clamp(16px,4vw,32px); z-index:30;
    font-size:13px; letter-spacing:.28em; color:#ffe9c9aa; text-indent:.28em}
  .rail{position:fixed; top:50%; right:clamp(12px,2.4vw,26px); transform:translateY(-50%);
    z-index:30; display:flex; flex-direction:column; gap:11px}
  .rail button{width:11px; height:11px; padding:0; border:0; border-radius:50%; cursor:pointer;
    background:#ffffff33; transition:transform .2s,background .2s}
  .rail button[aria-current="true"]{background:var(--gold); transform:scale(1.5)}
  .rail button:hover{background:#ffffff88}

  .hint{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:30;
    font-size:12px; letter-spacing:.24em; color:#ffe9c9; opacity:.85; text-align:center;
    transition:opacity .4s ease; pointer-events:none}
  .hint .arrow{display:block; margin:10px auto 0; width:16px; height:16px;
    border-right:2px solid #ffe9c9; border-bottom:2px solid #ffe9c9;
    transform:rotate(45deg); animation:bob 1.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:rotate(45deg) translate(0,0);opacity:.4}
    50%{transform:rotate(45deg) translate(4px,4px);opacity:1}}

  .foot{position:fixed; left:0; right:0; bottom:0; z-index:10; text-align:center;
    font-size:11px; line-height:1.7; color:#ffe9c955; padding:8px; opacity:.0;
    transition:opacity .4s ease; pointer-events:none}

  /* the invisible track: its height is what you actually scroll through */
  #track{position:relative; z-index:5; width:1px}

  @media (max-width:640px){ :root{--tilt:10deg} .book{width:94vw} }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} .hint .arrow{animation:none} }
</style>
</head>
<body>

<div class="brand" id="brand"></div>

<div class="deck" aria-hidden="true">
  <div class="parallax" id="parallax">
    <div class="book" id="book">
      <!-- cover + one .spread per chapter are injected here -->
    </div>
  </div>
</div>

<div class="captions" id="captions"><!-- one .cap per chapter --></div>

<div class="rail" id="rail"></div>
<div class="hint" id="hint">向下滾動 · 翻開繪本<span class="arrow"></span></div>
<div class="foot" id="foot"></div>

<div id="track"></div>

<script>
const STORY = {"title": "三隻小豬", "subtitle": "立體繪本 · Grok Imagine 生成實驗", "pages": [{"id": "p1", "title": "出發的那天早上", "text": "從前，有三隻小豬住在媽媽的小屋裡。有一天媽媽說：「你們長大了，該去蓋自己的房子啦。」\n阿草戴上草帽，阿木背起工具，最小的阿磚把小鏟子插進口袋，三隻小豬就這樣出發了。", "layers": [{"id": "bg", "depth": 0, "blend": "normal", "x": 0, "y": 0, "cut": false, "width": 100}, {"id": "mid", "depth": 80, "blend": "normal", "x": 2, "y": -4, "cut": true, "width": 66}, {"id": "fg", "depth": 170, "blend": "normal", "x": -30, "y": 6, "cut": true, "width": 30}], "video": {"from": "bg", "duration": 6}}, {"id": "p2", "title": "阿草的稻草屋", "text": "阿草最怕累。他抱來一大捆稻草，唏哩唏哩堆了一個下午，房子就蓋好了。\n「這樣就夠啦！」阿草打了個呵欠，躺在稻草堆上睡著了。", "layers": [{"id": "bg", "depth": 0, "blend": "normal", "x": 0, "y": 0, "cut": false, "width": 100}, {"id": "mid", "depth": 80, "blend": "normal", "x": 2, "y": -4, "cut": true, "width": 66}, {"id": "fg", "depth": 170, "blend": "normal", "x": -30, "y": 6, "cut": true, "width": 30}], "video": {"from": "bg", "duration": 6}}, {"id": "p3", "title": "阿木的木頭屋", "text": "阿木比較勤快。他鋸了木板，叮叮咚咚敲了一整天，蓋出一間木頭小屋。\n「比稻草牢固多了吧？」阿木很得意，也回屋裡休息了。", "layers": [{"id": "bg", "depth": 0, "blend": "normal", "x": 0, "y": 0, "cut": false, "width": 100}, {"id": "mid", "depth": 80, "blend": "normal", "x": 2, "y": -4, "cut": true, "width": 66}, {"id": "fg", "depth": 170, "blend": "normal", "x": -30, "y": 6, "cut": true, "width": 30}], "video": {"from": "bg", "duration": 6}}, {"id": "p4", "title": "阿磚的磚頭屋", "text": "最小的阿磚不急。他一塊一塊地抹上水泥、疊上磚頭，蓋了好久好久。\n哥哥們笑他傻，阿磚只是擦擦汗說：「慢慢蓋，才蓋得穩。」", "layers": [{"id": "bg", "depth": 0, "blend": "normal", "x": 0, "y": 0, "cut": false, "width": 100}, {"id": "mid", "depth": 80, "blend": "normal", "x": 2, "y": -4, "cut": true, "width": 66}, {"id": "fg", "depth": 170, "blend": "normal", "x": -30, "y": 6, "cut": true, "width": 30}], "video": {"from": "bg", "duration": 6}}, {"id": "p5", "title": "大野狼來了", "text": "夜裡，一隻又餓又瘦的大野狼聞到了小豬的味道。他走到稻草屋前，敲敲門。\n「小豬小豬，讓我進去。」「不行不行！」\n野狼深深吸一口氣——呼！稻草屋整個飛了起來。阿草拔腿就往木頭屋跑。", "layers": [{"id": "bg", "depth": 0, "blend": "normal", "x": 0, "y": 0, "cut": false, "width": 100}, {"id": "mid", "depth": 80, "blend": "normal", "x": 2, "y": -4, "cut": true, "width": 66}, {"id": "fg", "depth": 170, "blend": "normal", "x": -30, "y": 6, "cut": true, "width": 30}], "video": {"from": "bg", "duration": 8}}, {"id": "p6", "title": "木頭屋也倒了", "text": "野狼追到木頭屋前，又敲敲門。「小豬小豬，讓我進去。」「不行不行！」\n呼——！木板一片一片飛走了。阿草和阿木尖叫著，一起衝向弟弟的磚頭屋。", "layers": [{"id": "bg", "depth": 0, "blend": "normal", "x": 0, "y": 0, "cut": false, "width": 100}, {"id": "mid", "depth": 80, "blend": "normal", "x": 2, "y": -4, "cut": true, "width": 66}, {"id": "fg", "depth": 170, "blend": "normal", "x": -30, "y": 6, "cut": true, "width": 30}], "video": {"from": "bg", "duration": 8}}, {"id": "p7", "title": "吹不倒的房子", "text": "野狼來到磚頭屋前，用力吹！呼——呼——呼——\n磚頭屋一動也不動。野狼吹到頭昏眼花，氣得爬上屋頂，想從煙囪溜進去。\n可是阿磚早就在爐子上，架好了一鍋滾燙的熱水。", "layers": [{"id": "bg", "depth": 0, "blend": "normal", "x": 0, "y": 0, "cut": false, "width": 100}, {"id": "mid", "depth": 80, "blend": "normal", "x": 2, "y": -4, "cut": true, "width": 66}, {"id": "fg", "depth": 170, "blend": "normal", "x": -30, "y": 6, "cut": true, "width": 30}], "video": {"from": "bg", "duration": 8}}, {"id": "p8", "title": "從此平平安安", "text": "「哎呀燙燙燙！」野狼滾下屋頂，一路哭著跑進森林，再也沒有回來。\n三隻小豬擠在磚頭屋裡，煮了熱呼呼的湯。\n阿草說：「弟弟，下次我也要慢慢蓋。」窗外的月亮，笑得圓圓的。", "layers": [{"id": "bg", "depth": 0, "blend": "normal", "x": 0, "y": 0, "cut": false, "width": 100}, {"id": "mid", "depth": 80, "blend": "normal", "x": 2, "y": -4, "cut": true, "width": 66}, {"id": "fg", "depth": 170, "blend": "normal", "x": -30, "y": 6, "cut": true, "width": 30}], "video": {"from": "bg", "duration": 6}}]};
const MANIFEST = {"images": {"cover": "cover.jpg", "p1_bg": "p1_bg.jpg", "p1_mid": "p1_mid.jpg", "p1_fg": "p1_fg.jpg", "p2_bg": "p2_bg.jpg", "p2_mid": "p2_mid.jpg", "p2_fg": "p2_fg.jpg", "p3_bg": "p3_bg.jpg", "p3_mid": "p3_mid.jpg", "p3_fg": "p3_fg.jpg", "p4_bg": "p4_bg.jpg", "p4_mid": "p4_mid.jpg", "p4_fg": "p4_fg.jpg", "p5_bg": "p5_bg.jpg", "p5_mid": "p5_mid.jpg", "p5_fg": "p5_fg.jpg", "p6_bg": "p6_bg.jpg", "p6_mid": "p6_mid.jpg", "p6_fg": "p6_fg.jpg", "p7_bg": "p7_bg.jpg", "p7_mid": "p7_mid.jpg", "p7_fg": "p7_fg.jpg", "p8_bg": "p8_bg.jpg", "p8_mid": "p8_mid.jpg", "p8_fg": "p8_fg.jpg"}, "videos": {"cover": "cover.mp4", "p2": "p2.mp4", "p3": "p3.mp4", "p4": "p4.mp4", "p5": "p5.mp4", "p6": "p6.mp4", "p7": "p7.mp4", "p8": "p8.mp4", "p1": "p1.mp4"}, "generated_at": "2026-09-15T09:13:48Z", "models": {"image": "grok image_gen (cli)", "video": "grok image_to_video (cli)"}};

const SEG_VH = 1.15;   // scroll length (in viewport-heights) per chapter / cover
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---- placeholder cut-paper art, shown until a Grok Imagine asset exists ---- */
const PALETTE = {
  bg:  ['#bcd9e8','#8fb98d','#e4d3ad'],
  mid: ['#f2c9b4','#d98b6a','#8a5a3c'],
  fg:  ['#e9d7a8','#b99a5e','#6f7f52'],
};
function placeholder(layerId, label){
  const c = PALETTE[layerId] || PALETTE.fg;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024">
    <rect width="1536" height="1024" fill="${layerId==='bg'?c[0]:'#fbf3e2'}"/>
    ${layerId==='bg' ? `
      <path d="M0 700 Q384 600 768 690 T1536 660 V1024 H0Z" fill="${c[1]}"/>
      <circle cx="1240" cy="220" r="96" fill="#f6e6b4"/>
      <ellipse cx="420" cy="230" rx="180" ry="66" fill="#ffffffcc"/>
      <ellipse cx="760" cy="180" rx="130" ry="52" fill="#ffffffaa"/>` : `
      <path d="M300 820 L500 300 L760 200 L1030 320 L1230 820Z" fill="${c[1]}" opacity=".92"/>
      <circle cx="768" cy="470" r="150" fill="${c[0]}"/>
      <rect x="640" y="620" width="256" height="200" rx="18" fill="${c[2]}" opacity=".85"/>`}
    <text x="768" y="965" font-family="monospace" font-size="42" fill="#00000055"
      text-anchor="middle">${label}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const assetFor = (pid, layerId) => { const n = MANIFEST.images?.[`${pid}_${layerId}`]; return n?`assets/${n}`:null; };
const videoFor = (key) => { const n = MANIFEST.videos?.[key]; return n?`assets/${n}`:null; };
const coverImg = () => { const n = MANIFEST.images?.cover; return n?`assets/${n}`:null; };

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function smooth(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); } // smoothstep

/* ---------- build the DOM from the story ---------- */
const book = document.getElementById('book');
const capsBox = document.getElementById('captions');
const rail = document.getElementById('rail');
const N = STORY.pages.length;

// cover
const cover = document.createElement('div');
cover.className = 'cover';
{
  const ci = coverImg();
  cover.innerHTML =
    (ci ? `<div class="plate-frame"><img src="${ci}" alt=""></div><div class="veil"></div>` : '') +
    `<div class="band">
       <h1>${STORY.title}</h1>
       <p class="sub">${STORY.subtitle || ''}</p>
     </div>`;
}
book.appendChild(cover);

// spreads (one per chapter), stacked; earlier chapters sit on top of the stack
const spreads = STORY.pages.map((page, i) => {
  const sp = document.createElement('div');
  sp.className = 'spread';
  sp.style.zIndex = String(100 - i);
  sp.innerHTML = '<div class="grain"></div><div class="gutter"></div>';

  const layers = page.layers.map((layer, li) => {
    const wrap = document.createElement('div');
    wrap.className = 'layer ' + (layer.cut ? 'cut' : 'plate');
    wrap.dataset.id = layer.id;
    wrap.style.setProperty('--z', (layer.depth || 0) + 'px');
    wrap.style.setProperty('--w', (layer.width ?? 100) + '%');
    wrap.style.setProperty('--dx', (layer.x || 0) + '%');
    wrap.style.setProperty('--dy', (layer.y || 0) + '%');
    wrap.style.zIndex = String(li + 1);

    const src = assetFor(page.id, layer.id);
    const img = document.createElement('img');
    img.alt = `${page.title} · ${layer.id}`; img.decoding = 'async';   // eager: the fixed stage keeps every card in-viewport, lazy just risked blank cards
    img.src = src || placeholder(layer.id, `${page.id}_${layer.id} · 尚未生成`);
    if (src) img.onerror = () => { img.src = placeholder(layer.id, `${page.id}_${layer.id} · 缺檔`); };
    wrap.appendChild(img);
    sp.appendChild(wrap);
    return wrap;
  });

  book.appendChild(sp);

  // caption
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.innerHTML = `<div class="k">第 ${i + 1} 章 / ${N}</div>
    <h2>${page.title}</h2><p>${page.text}</p>`;
  capsBox.appendChild(cap);

  // rail dot
  const dot = document.createElement('button');
  dot.type = 'button'; dot.setAttribute('aria-label', `第 ${i + 1} 章`);
  dot.addEventListener('click', () => scrollToChapter(i));
  rail.appendChild(dot);

  return { el: sp, layers, cap, page, videoBg: null };
});

document.getElementById('brand').textContent = STORY.title;

// footer note about asset state
const nImg = Object.keys(MANIFEST.images || {}).length;
const nVid = Object.keys(MANIFEST.videos || {}).length;
const nWant = STORY.pages.reduce((a, p) => a + p.layers.length, 0) + 1; // + cover
document.getElementById('foot').textContent = nImg
  ? `Grok Imagine：${nImg}/${nWant} 圖、${nVid} 影片（${MANIFEST.models?.image||''}／${MANIFEST.models?.video||''}）· 滾動翻頁 · 移動滑鼠傾斜立體場景`
  : `目前為紙雕佔位圖 · 設定 XAI_API_KEY → 執行 scripts/grok_gen.py 生成素材 → scripts/build_book.py 即自動換上`;

/* ---------- scroll → drive the 3D ---------- */
const track = document.getElementById('track');
// Scroll ends with the last chapter at rest: cover+chapters span scrollY 0..N*seg
// (chapter i is active at scrollY=(i+1)*seg), plus one viewport height so the last
// spread can sit centred, plus a small tail so it settles instead of hard-clamping.
// The old (N+2)*SEG_VH height overshot by ~1.1 chapters, scrolling past chapter 8
// into a blank desk.
const TAIL_VH = 16;
function layout(){ track.style.height = (N * SEG_VH * 100 + 100 + TAIL_VH) + 'vh'; }
layout();

let currentVideo = -1;
function setActiveVideo(idx){
  if (idx === currentVideo) return;
  // tear down previous
  if (currentVideo >= 0){
    const prev = spreads[currentVideo];
    const plate = prev.el.querySelector('.layer.plate');
    if (prev.videoBg && plate){
      const img = document.createElement('img');
      img.src = assetFor(prev.page.id, 'bg') || placeholder('bg', `${prev.page.id}_bg`);
      img.style.cssText = 'width:100%;height:100%;object-fit:cover';
      plate.replaceChildren(img); prev.videoBg = null;
    }
  }
  currentVideo = idx;
  if (idx < 0) return;
  const cur = spreads[idx];
  const url = videoFor(cur.page.id);
  const plate = cur.el.querySelector('.layer.plate');
  if (!url || !plate) return;
  const v = document.createElement('video');
  v.src = url; v.loop = v.muted = v.playsInline = v.autoplay = true;
  plate.replaceChildren(v); cur.videoBg = v;
  v.play().catch(()=>{});
}

const hint = document.getElementById('hint');
const railBtns = [...rail.children];

function scrub(){
  const seg = innerHeight * SEG_VH;
  const y = scrollY;

  // cover turns up and away over the first segment
  const coverT = y / seg;
  const lift = smooth(0.06, 0.82, coverT);
  cover.style.setProperty('--turn', (reduced ? 0 : lift * -128) + 'deg');
  cover.style.opacity = (1 - smooth(0.55, 0.98, coverT)).toFixed(3);
  cover.style.visibility = coverT > 1.12 ? 'hidden' : 'visible';

  const pos = y / seg - 1;          // 0 ⇒ chapter 0 centred/active
  let best = -1, bestAbs = 9;

  spreads.forEach((sp, i) => {
    const t = pos - i;              // <0 still to come (flat, under), >0 turning away
    if (t <= -1.1 || t >= 1.1){
      sp.el.style.visibility = 'hidden';
      sp.cap.style.display = 'none';   // fully remove culled captions from the paint tree
      return;
    }
    sp.el.style.visibility = 'visible';

    const back = clamp(-t, 0, 1);                 // how far "underneath" (future page)
    const turn = reduced ? 0 : smooth(0.22, 0.96, t) * -120;
    const inOp  = smooth(-1.08, -0.82, t);
    const outOp = 1 - smooth(0.52, 1.0, t);
    sp.el.style.setProperty('--turn', turn.toFixed(1) + 'deg');
    sp.el.style.setProperty('--sc', (1 - 0.05 * back).toFixed(3));
    sp.el.style.setProperty('--sz', (-26 * back).toFixed(0) + 'px');
    sp.el.style.opacity = Math.min(inOp, outOp).toFixed(3);

    // pop-ups rise, staggered back-to-front
    sp.layers.forEach((L, li) => {
      const s = reduced ? 1 : smooth(-0.88, -0.26, t + li * 0.06);
      L.style.setProperty('--fold', ((s - 1) * 90).toFixed(1) + 'deg');
    });

    // caption reveal (kaori-style: slide up + fade in). The visible band is < 1
    // chapter wide and meets its neighbours at cop=0, so two captions never
    // overlap during a page-turn — the outgoing one is fully gone before the
    // incoming one appears.
    const cop = Math.min(smooth(-0.5, -0.28, t), 1 - smooth(0.28, 0.5, t));
    if (cop < 0.01){
      sp.cap.style.display = 'none';
    } else {
      sp.cap.style.display = '';
      sp.cap.style.opacity = cop.toFixed(3);
      sp.cap.style.transform = `translateY(${((1 - cop) * 28).toFixed(1)}px)`;
    }

    const a = Math.abs(t);
    if (a < bestAbs){ bestAbs = a; best = i; }
  });

  setActiveVideo(bestAbs < 0.5 ? best : -1);
  railBtns.forEach((b, i) => b.setAttribute('aria-current', String(i === best && bestAbs < 0.5 && coverT > 0.9)));
  hint.style.opacity = y > innerHeight * 0.3 ? '0' : '.85';
  document.getElementById('foot').style.opacity = coverT > 0.9 ? '1' : '0';
}

function scrollToChapter(i){ scrollTo({ top: (i + 1) * innerHeight * SEG_VH, behavior:'smooth' }); }

/* rAF-throttled scroll */
let ticking = false;
function onScroll(){ if (!ticking){ ticking = true; requestAnimationFrame(()=>{ scrub(); ticking = false; }); } }
addEventListener('scroll', onScroll, { passive:true });
addEventListener('resize', () => { layout(); scrub(); });

/* pointer parallax — tilt the whole book toward the cursor */
if (!reduced){
  const px = document.getElementById('parallax');
  addEventListener('pointermove', e => {
    const x = e.clientX / innerWidth - .5, yy = e.clientY / innerHeight - .5;
    px.style.setProperty('--ry', (x * 12).toFixed(2) + 'deg');
    px.style.setProperty('--rx', (-yy * 8).toFixed(2) + 'deg');
  });
}

/* keyboard: page through chapters */
addEventListener('keydown', e => {
  const seg = innerHeight * SEG_VH;
  if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); scrollBy({ top: seg, behavior:'smooth' }); }
  if (e.key === 'ArrowUp'   || e.key === 'PageUp'){ e.preventDefault(); scrollBy({ top:-seg, behavior:'smooth' }); }
  if (e.key === 'Home'){ e.preventDefault(); scrollTo({ top:0, behavior:'smooth' }); }
  if (e.key === 'End'){ e.preventDefault(); scrollToChapter(N - 1); }
});

scrub();
</script>
</body>
</html>
